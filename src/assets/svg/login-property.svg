<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" fill="none">
  <defs>
    <linearGradient id="halo" x1="200" y1="80" x2="720" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2f6fd"/>
      <stop offset="1" stop-color="#e3ecfa"/>
    </linearGradient>
    <linearGradient id="towerA" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8ea9de"/>
      <stop offset="1" stop-color="#5f7dbf"/>
    </linearGradient>
    <linearGradient id="towerB" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9fb7e8"/>
      <stop offset="1" stop-color="#6a88c9"/>
    </linearGradient>
    <linearGradient id="towerC" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b3c8ee"/>
      <stop offset="1" stop-color="#7f9cd6"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3d5a96"/>
      <stop offset="1" stop-color="#24365e"/>
    </linearGradient>

    <pattern id="winA" width="30" height="34" patternUnits="userSpaceOnUse">
      <rect x="6" y="8" width="16" height="16" rx="3" fill="#dce8fb" opacity="0.85"/>
    </pattern>
    <pattern id="winB" width="36" height="40" patternUnits="userSpaceOnUse">
      <rect x="8" y="9" width="19" height="19" rx="4" fill="#e6effd" opacity="0.9"/>
    </pattern>
    <pattern id="winC" width="28" height="32" patternUnits="userSpaceOnUse">
      <rect x="6" y="7" width="15" height="15" rx="3" fill="#e6effd" opacity="0.85"/>
    </pattern>

    <clipPath id="clipA">
      <rect x="180" y="140" width="150" height="300" rx="16"/>
    </clipPath>
    <clipPath id="clipB">
      <rect x="340" y="70" width="180" height="370" rx="18"/>
    </clipPath>
    <clipPath id="clipC">
      <rect x="530" y="170" width="120" height="270" rx="14"/>
    </clipPath>
  </defs>

  <!-- 背景光晕 -->
  <circle cx="430" cy="268" r="222" fill="url(#halo)"/>
  <circle cx="700" cy="150" r="46" fill="#eaf1fc"/>
  <circle cx="170" cy="120" r="26" fill="#edf3fc"/>

  <!-- 地面阴影 -->
  <ellipse cx="430" cy="448" rx="292" ry="18" fill="#cfdcf3" opacity="0.75"/>

  <!-- 左侧楼栋 -->
  <rect x="180" y="140" width="150" height="300" rx="16" fill="url(#towerA)"/>
  <rect x="180" y="140" width="150" height="300" rx="16" fill="url(#winA)" clip-path="url(#clipA)"/>
  <rect x="196" y="120" width="42" height="24" rx="6" fill="#5f7dbf"/>

  <!-- 右侧楼栋 -->
  <rect x="530" y="170" width="120" height="270" rx="14" fill="url(#towerC)"/>
  <rect x="530" y="170" width="120" height="270" rx="14" fill="url(#winC)" clip-path="url(#clipC)"/>
  <rect x="546" y="152" width="34" height="20" rx="6" fill="#7f9cd6"/>

  <!-- 中间主楼 -->
  <rect x="340" y="70" width="180" height="370" rx="18" fill="url(#towerB)"/>
  <rect x="340" y="70" width="180" height="370" rx="18" fill="url(#winB)" clip-path="url(#clipB)"/>
  <rect x="360" y="46" width="52" height="26" rx="8" fill="#6a88c9"/>
  <rect x="424" y="46" width="26" height="26" rx="7" fill="#8ea9de"/>

  <!-- 楼栋底部绿化 -->
  <rect x="150" y="428" width="36" height="12" rx="6" fill="#a8c6bb"/>
  <circle cx="150" cy="414" r="16" fill="#9fc6b4"/>
  <circle cx="168" cy="420" r="12" fill="#b3d3c4"/>
  <rect x="156" y="424" width="6" height="14" rx="3" fill="#8bb3a1"/>
  <circle cx="512" cy="416" r="14" fill="#9fc6b4"/>
  <circle cx="498" cy="424" r="10" fill="#b3d3c4"/>
  <rect x="508" y="426" width="6" height="12" rx="3" fill="#8bb3a1"/>

  <!-- 手机外阴影 -->
  <ellipse cx="762" cy="466" rx="86" ry="12" fill="#cfdcf3" opacity="0.7"/>

  <!-- 手机机身 -->
  <rect x="686" y="168" width="152" height="294" rx="28" fill="url(#phoneBody)"/>
  <rect x="696" y="180" width="132" height="270" rx="19" fill="#f8fbff"/>
  <rect x="742" y="187" width="40" height="6" rx="3" fill="#d5e0f2"/>

  <!-- 屏幕内容：门禁卡片 -->
  <rect x="712" y="206" width="58" height="8" rx="4" fill="#ccd9ee"/>
  <rect x="712" y="230" width="100" height="96" rx="13" fill="#eef4fd"/>
  <rect x="743" y="246" width="38" height="60" rx="7" stroke="#3b5598" stroke-width="3"/>
  <circle cx="773" cy="278" r="2.6" fill="#3b5598"/>
  <circle cx="806" cy="318" r="13" fill="#43c6a0"/>
  <path d="M800.5 318.2l3.8 3.8 7.4-7.6" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 屏幕内容：列表行 -->
  <rect x="712" y="342" width="100" height="14" rx="7" fill="#e2ebf9"/>
  <rect x="712" y="366" width="76" height="14" rx="7" fill="#e2ebf9"/>
  <rect x="742" y="434" width="40" height="4" rx="2" fill="#c9d5ea"/>

  <!-- 信号弧线 -->
  <path d="M668 196c22-20 46-30 70-32" stroke="#8fb0e6" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M676 214c14-13 30-20 46-22" stroke="#a9c2ee" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- 浮动卡片：已授权 -->
  <g>
    <rect x="560" y="120" width="124" height="58" rx="14" fill="#ffffff"/>
    <rect x="560" y="120" width="124" height="58" rx="14" fill="#eef3fc" opacity="0.35"/>
    <circle cx="586" cy="149" r="14" fill="#e6f7f1"/>
    <path d="M579.8 149.3l4.1 4.1 8.1-8.3" stroke="#2fae8b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="610" y="134" width="54" height="9" rx="4.5" fill="#cdd9ee"/>
    <rect x="610" y="152" width="38" height="8" rx="4" fill="#e0e9f8"/>
  </g>

  <!-- 浮动卡片：报修 -->
  <g>
    <rect x="120" y="232" width="118" height="56" rx="14" fill="#ffffff"/>
    <rect x="120" y="232" width="118" height="56" rx="14" fill="#eef3fc" opacity="0.35"/>
    <circle cx="145" cy="260" r="14" fill="#e8effb"/>
    <rect x="139" y="254" width="12" height="12" rx="3" stroke="#5f7dbf" stroke-width="2.4"/>
    <path d="M145 252v4" stroke="#5f7dbf" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="168" y="246" width="52" height="9" rx="4.5" fill="#cdd9ee"/>
    <rect x="168" y="264" width="34" height="8" rx="4" fill="#e0e9f8"/>
  </g>
</svg>
